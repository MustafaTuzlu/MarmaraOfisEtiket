name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions sekmesinden elle de çalıştırılabilir (istenen dal seçilebilir)

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write local config (secret'lardan)
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'mail.kurumsaleposta.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || 'ssl' }}
          SMTP_USER: ${{ vars.SMTP_USER || 'iletisim@marmaraofisetiket.net' }}
          DB_PASS: ${{ secrets.EMEKLI_DB_PASS }}
          DB_HOST: ${{ vars.EMEKLI_DB_HOST || 'localhost' }}
          DB_PORT: ${{ vars.EMEKLI_DB_PORT || '3306' }}
          DB_NAME: ${{ vars.EMEKLI_DB_NAME || 'marmaraofisetiket_net_emeklirobot' }}
          DB_USER: ${{ vars.EMEKLI_DB_USER || 'marma_emekli' }}
          EMEKLI_API_KEY: ${{ secrets.EMEKLI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          q = lambda v: "'" + v.replace("\\", "\\\\").replace("'", "\\'") + "'"
          e = os.environ
          out = "<?php\n"
          if e.get('SMTP_PASS'):
              out += ("$SMTP = ['host' => %s, 'port' => %d, 'secure' => %s, 'user' => %s, 'pass' => %s];\n"
                      "$MAIL_FROM = %s;\n" % (q(e['SMTP_HOST']), int(e['SMTP_PORT']), q(e['SMTP_SECURE']), q(e['SMTP_USER']), q(e['SMTP_PASS']), q(e['SMTP_USER'])))
          else:
              print("SMTP_PASS secret tanımlı değil; SMTP ayarı yazılmadı (mail() kullanılacak).")
          if e.get('DB_PASS'):
              out += "$DB = ['host' => %s, 'port' => %d, 'name' => %s, 'user' => %s, 'pass' => %s];\n" % (q(e['DB_HOST']), int(e['DB_PORT']), q(e['DB_NAME']), q(e['DB_USER']), q(e['DB_PASS']))
          else:
              print("EMEKLI_DB_PASS secret tanımlı değil; EmekliRobot DB ayarı yazılmadı.")
          if e.get('EMEKLI_API_KEY'):
              out += "$EMEKLI_API_KEY = %s;\n" % q(e['EMEKLI_API_KEY'])
          else:
              print("EMEKLI_API_KEY secret tanımlı değil; API 503 dönecek.")
          open('config.local.php', 'w').write(out)
          PY
          php -l config.local.php || true

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # Sunucudaki hedef klasör (sonunda / olmalı). Repo variable: FTP_DIR  (ör. /httpdocs/). Boşsa kök klasör.
          server-dir: ${{ vars.FTP_DIR || '/' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            orijinal/**
            **/.DS_Store
            README.md
            CLAUDE.md
            db/**
            docs/**

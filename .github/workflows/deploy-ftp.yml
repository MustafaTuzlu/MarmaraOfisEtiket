name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions sekmesinden elle de çalıştırılabilir (istenen dal seçilebilir)

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # Sunucudaki hedef klasör (sonunda / olmalı). Repo variable: FTP_DIR  (ör. /httpdocs/). Boşsa kök klasör.
          server-dir: ${{ vars.FTP_DIR || '/' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            orijinal/**
            config.local.php
            README.md
